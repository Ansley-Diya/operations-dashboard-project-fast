<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operations Dashboard — FAST</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- ─── IMPORTMAP ──────────────────────────────────────────────────────────
       The browser cannot find node_modules on its own.
       An importmap tells the browser: "when you see this import name,
       look at this actual file path instead."
       This is the only change needed to make Live Server work with npm packages.
       No bundler. No build step. Just this one block.                          -->
  <script type="importmap">
    {
      "imports": {
        "@microsoft/fast-element": "/node_modules/@microsoft/fast-element/dist/esm/index.js",
        "@microsoft/fast-element/": "/node_modules/@microsoft/fast-element/"
      }
    }
  </script>

</head>
<body>

  <app-shell>
    <div slot="content" class="dashboard-grid">
      <metric-card></metric-card>
      <metric-card></metric-card>
      <metric-card></metric-card>
      <service-status></service-status>
      <alert-list></alert-list>
      <activity-table></activity-table>
    </div>
  </app-shell>

  <app-modal></app-modal>
  <toast-container></toast-container>

  <!-- type="module" is required — enables import statements in the browser -->
  <script type="module" src="components/metric-card.js"></script>
  <script type="module" src="components/app-shell.js"></script>
  <script type="module" src="components/service-status.js"></script>
  <script type="module" src="components/app-modal.js"></script>
  <script type="module" src="components/toast-container.js"></script>
  <script type="module" src="components/toast-message.js"></script>
  <script type="module" src="components/alert-item.js"></script>
  <script type="module" src="components/alert-list.js"></script>
  <script type="module" src="components/activity-table.js"></script>
  <script type="module" src="main.js"></script>

</body>
</html>
